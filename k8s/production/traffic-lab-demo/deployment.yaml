apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-lab-demo
  labels:
    deploy-service.io/stage: production
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-lab-demo
  template:
    metadata:
      labels:
        app: traffic-lab-demo
        deploy-service.io/stage: production
    spec:
      containers:
        - name: traffic-lab-demo
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
